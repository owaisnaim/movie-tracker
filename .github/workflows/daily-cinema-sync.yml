name: Daily Cinema Catalog Sync

on:
  schedule:
    # Morning Sync: 06:47 AM IST (01:17 UTC) - Odd minute skips :00 and :30 queue spikes
    - cron: '17 1 * * *'
    # Afternoon Sync: 02:17 PM IST (08:47 UTC) - Odd minute skips :00 and :30 queue spikes
    - cron: '47 8 * * *'
  workflow_dispatch:

concurrency:
  group: daily-cinema-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: "Asia/Kolkata"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Cinema Movies to Cloudflare KV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -u sync_cinema_catalog.py
